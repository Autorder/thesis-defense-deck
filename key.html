<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Relay Key</title>
<style>
  :root{--bg:#F6F4EE;--panel:#fff;--ink:#1d2420;--mut:#6b716c;--line:#ddd8cc;--ok:#1F7A5A;--bad:#B23A3A;--amber:#9C6A15}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#0d1210;--panel:#151b18;--ink:#e8ece9;--mut:#9aa39d;--line:#2a332e;--ok:#3fbf8a;--bad:#e26a5f;--amber:#d9a441}
  }
  :root[data-theme="dark"]{--bg:#0d1210;--panel:#151b18;--ink:#e8ece9;--mut:#9aa39d;--line:#2a332e;--ok:#3fbf8a;--bad:#e26a5f;--amber:#d9a441}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  main{max-width:560px;margin:0 auto;padding:24px 16px}
  h1{font-size:1.4rem;margin:0 0 6px}
  p{margin:0 0 12px;color:var(--mut)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--bg);color:var(--ink);direction:ltr;font-size:16px}
  button{min-height:46px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 16px;font-weight:800;font-size:16px;cursor:pointer}
  button.main{background:var(--amber);border-color:var(--amber);color:#fff}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
  dt{color:var(--mut)} dd{margin:0;font-weight:800}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  #msg{min-height:1.6em;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>מפתח ההעברה למכשיר הזה</h1>
  <p>המפתח נשמר רק בדפדפן של המכשיר הזה — לא באתר. עשה זאת פעם אחת במחשב ופעם אחת ב-iPad.</p>

  <div class="box">
    <form id="f">
      <input id="t" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tk_…">
      <button class="main">שמור</button>
      <button type="button" id="clear">מחק מהמכשיר</button>
    </form>
    <div id="msg"></div>
  </div>

  <div class="box">
    <dl>
      <dt>נספר לפי</dt><dd id="basis">…</dd>
      <dt>נשלחו היום</dt><dd id="used">…</dd>
      <dt>נשארו</dt><dd id="left">…</dd>
      <dt>האיפוס הבא</dt><dd id="reset">…</dd>
    </dl>
  </div>
  <button type="button" id="again">רענן</button>
</main>
<script src="script_view.js"></script>
<script>
(function(){
  "use strict";
  var SV = window.ScriptView, $ = function(id){ return document.getElementById(id); };
  function say(t, cls){ $("msg").textContent = t; $("msg").className = cls || ""; }
  function show(){
    ["basis","used","left","reset"].forEach(function(k){ $(k).textContent = "…"; });
    SV.account().then(function(a){
      if (a && a.code === 40101){ $("basis").textContent = "המפתח לא תקף"; $("basis").className = "bad"; return; }
      var l = a.limits || {}, s = a.stats || {};
      $("basis").textContent = l.basis === "ip" ? "רשת (בלי מנוי)" : "חשבון " + (a.username || "") + (a.tier && a.tier.name ? " · " + a.tier.name : "");
      $("basis").className = l.basis === "ip" ? "" : "ok";
      $("used").textContent = (s.messages || 0) + " מתוך " + (l.messages || "?");
      $("left").textContent = s.messages_remaining;
      $("left").className = s.messages_remaining > 40 ? "ok" : "bad";
      $("reset").textContent = s.reset_at ? new Date(s.reset_at * 1000).toLocaleString("he-IL", { timeZone: "Asia/Jerusalem", weekday: "short", hour: "2-digit", minute: "2-digit", day: "numeric", month: "numeric" }) + " (שעון ישראל)" : "—";
    }).catch(function(){ $("basis").textContent = "אין חיבור לשרת ההעברה"; $("basis").className = "bad"; });
  }
  $("f").onsubmit = function(ev){
    ev.preventDefault();
    var t = $("t").value.trim();
    if (!/^tk_[A-Za-z0-9]+$/.test(t)){ say("מפתח של ntfy מתחיל ב-tk_", "bad"); return; }
    SV.token(t); $("t").value = ""; say("נשמר במכשיר הזה.", "ok"); show();
  };
  $("clear").onclick = function(){ SV.token(""); say("נמחק מהמכשיר — חוזרים לספירה לפי רשת."); show(); };
  $("again").onclick = show;
  if (SV.token()) say("יש מפתח שמור במכשיר הזה.", "ok");
  show();
})();
</script>
</body>
</html>
