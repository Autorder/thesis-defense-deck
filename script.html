<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Presenter Script</title>
<style>
  :root{
    --bg:#f6f4ee; --panel:#fff; --ink:#1b2420; --mut:#66746d; --line:#ddd8cc;
    --amber:#9C6A15; --red:#B23A3A; --warnbg:#fbeceb; --warnline:#e7c4c0; --warnink:#5b2420;
    --ok:#1F7A5A; --bad:#B23A3A; --barbg:rgba(246,244,238,.94); --fs:1.5rem;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1311; --panel:#161d1a; --ink:#e9efeb; --mut:#93a29a; --line:#26302b;
      --amber:#E8A310; --warnbg:#3a1f1d; --warnline:#5a2f2c; --warnink:#f3dcd9;
      --ok:#3fbf8a; --bad:#e26a5f; --barbg:rgba(10,14,12,.94);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1311; --panel:#161d1a; --ink:#e9efeb; --mut:#93a29a; --line:#26302b;
    --amber:#E8A310; --warnbg:#3a1f1d; --warnline:#5a2f2c; --warnink:#f3dcd9;
    --ok:#3fbf8a; --bad:#e26a5f; --barbg:rgba(10,14,12,.94);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  button,input{font-family:inherit;font-size:1rem;color:var(--ink)}

  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #top{flex:none;position:relative;z-index:5;background:var(--barbg);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #conn{display:flex;align-items:center;gap:7px;font-size:.9rem;font-weight:700;color:var(--mut);white-space:nowrap}
  #conn i{width:11px;height:11px;border-radius:50%;background:var(--bad);display:inline-block}
  #conn.on i{background:var(--ok)}
  #conn.on{color:var(--ok)}
  #where{flex:1 1 auto;min-width:0;font-size:.9rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #top .btns{display:flex;gap:6px}
  #top button{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    min-width:46px;min-height:44px;padding:0 12px;font-weight:800;cursor:pointer}
  #live{border-color:var(--amber)!important;color:var(--amber)}
  #live[hidden]{display:none}

  /* the slide beside the script: left of it in landscape, above it in portrait */
  #split{flex:1 1 auto;min-height:0;display:flex;flex-direction:row-reverse}
  #slidepane{flex:0 0 var(--paneW, 46%);padding:14px 0 14px max(14px, env(safe-area-inset-left));display:flex;align-items:flex-start;justify-content:center}
  #slidebox{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border-radius:8px;overflow:hidden;
    box-shadow:0 0 0 1px var(--line);pointer-events:none}
  #slidebox iframe{position:absolute;top:0;left:0;width:1920px;height:1080px;border:0;transform-origin:top left;
    background:#fff;pointer-events:none;visibility:hidden}
  #slidebox iframe.on{visibility:visible}
  @media (orientation: portrait){
    #split{flex-direction:column}
    #slidepane{flex:none;padding:12px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
    #slidebox{width:min(100%, var(--paneH, 38vh) * 16 / 9)}
    #grip{flex:0 0 18px;cursor:row-resize}
    #grip::after{width:56px;height:5px}
  }
  /* drag to set how much room the slide gets */
  #grip{flex:0 0 18px;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
  #grip::after{content:"";width:5px;height:56px;border-radius:3px;background:var(--line)}
  #grip.drag::after{background:var(--amber)}
  body.noslide #slidepane,body.noslide #grip{display:none}
  #slidebtn.off,#helpbtn.off{opacity:.55}
  body.nohelp .warn,body.nohelp details.qa{display:none}
  main{flex:1 1 auto;min-width:0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:18px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));}
  main>*{max-width:60rem;margin-left:auto;margin-right:auto}
  #head{margin:4px 0 16px}
  #head .num{font-size:1rem;font-weight:800;color:var(--amber);margin-inline-end:10px}
  #head .role{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--mut)}
  #head h1{text-align:right;margin:6px 0 0;font-size:1.45rem;line-height:1.35;font-weight:800}

  .sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .sc>summary{cursor:pointer;list-style:none;padding:10px 18px;font-size:.95rem;font-weight:800;
    display:flex;align-items:center;gap:10px;color:var(--mut)}
  .sc>summary::-webkit-details-marker{display:none}
  .sc>summary::before{content:"\25B8";color:var(--amber);transition:transform .2s}
  .sc[open]>summary::before{transform:rotate(90deg)}
  .sc>summary .n{font-size:.75rem;margin-inline-start:auto}
  .scbody{padding:2px 20px 16px}
  /* the warning is a reminder, not the script — small and tight */
  .warn{background:var(--warnbg);border:1px solid var(--warnline);border-inline-start:4px solid var(--red);
    border-radius:8px;padding:8px 12px;font-size:.95rem;line-height:1.55;color:var(--warnink);margin:0 0 14px}
  .warn b{color:var(--red)}
  .lines p{margin:0 0 .6em;font-size:var(--fs);line-height:1.85;text-wrap:pretty}
  .lines p em{font-style:normal;color:var(--amber)}
  .qitem{border-top:1px solid var(--line);padding:12px 0 10px}
  .qitem:first-child{border-top:0}
  .qitem .q{font-size:1.1rem;font-weight:800;color:var(--amber);line-height:1.6;margin:0 0 6px}
  .qitem .a{font-size:1.05rem;line-height:1.8;margin:0}
  .qitem .go{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:700;color:var(--mut);
    border:1px solid var(--line);border-radius:999px;padding:2px 11px}

  #setup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  #setup p{margin:0 0 10px;line-height:1.6}
  #setup form{display:flex;gap:8px}
  #setup input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:var(--bg);direction:ltr}
  #setup button{min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-weight:800}
  #setup[hidden]{display:none}

  /* the remote moves the projected deck: filled, at the bottom, far from the browse buttons above */
  #remote{flex:none;position:relative;z-index:5;background:var(--barbg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:2px solid var(--amber);
    padding:8px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display:flex;align-items:center;gap:14px;}
  #remote[hidden]{display:none}
  #remote .cap{font-size:.8rem;font-weight:800;color:var(--amber);white-space:nowrap}
  #remote button{flex:1;min-height:64px;border-radius:14px;border:0;background:var(--amber);color:#fff;
    font-size:1.25rem;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:opacity .15s,background .15s}
  #remote button:active{opacity:.7}
  #remote button.busy{opacity:.6}
  #remote button.fail{background:var(--bad)}
  #remote #rmenu{flex:0 0 auto;min-width:64px;padding:0 14px;font-size:1.6rem}
  #sheet{position:fixed;inset:0;z-index:8;display:none;background:rgba(0,0,0,.45)}
  #sheet.open{display:block}
  #sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:75vh;overflow-y:auto;background:var(--panel);
    border-top:2px solid var(--amber);border-radius:16px 16px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom))}
  #sheet .grp{font-size:.75rem;font-weight:800;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding:12px 8px 4px}
  #sheet .row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 10px;margin:2px 0;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:start;cursor:pointer;font-weight:700}
  #sheet .row.home{border-color:var(--amber);color:var(--amber)}
  #sheet .row .k{flex:none;width:28px;text-align:center;font-weight:800;color:var(--amber)}
  #sheet .empty{padding:16px 8px;color:var(--mut)}
  #rprev{flex:0 0 32%!important;background:transparent!important;color:var(--amber)!important;border:2px solid var(--amber)!important}
</style>
</head>
<body>
<div id="top">
  <span id="conn"><i></i><span id="connt">מנותק</span></span>
  <span id="where" dir="auto"></span>
  <span class="btns">
    <button id="live" hidden title="חזרה לשקף שמוצג עכשיו">חי</button>
    <button id="prev" title="השקף הקודם">&rarr;</button>
    <button id="next" title="השקף הבא">&larr;</button>
    <button id="slidebtn" title="הצגה / הסתרה של השקף">שקף</button>
    <button id="helpbtn" title="הצגה / הסתרה של האזהרות והשאלות הצפויות">עזרים</button>
    <button id="smaller" title="טקסט קטן יותר">א&minus;</button>
    <button id="bigger" title="טקסט גדול יותר">א+</button>
  </span>
</div>
<div id="split">
<div id="slidepane"><div id="slidebox"><iframe tabindex="-1" scrolling="no"></iframe><iframe tabindex="-1" scrolling="no"></iframe></div></div>
<div id="grip" title="גרירה: גודל השקף"></div>
<main id="main">
  <div id="setup" hidden>
    <p>הדף הזה עוקב אחרי המצגת. פתח במחשב את המצגת עם <b dir="ltr">?sync=&lt;קוד&gt;</b>, והקלד כאן את אותו קוד.</p>
    <form id="setupf"><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="code"><button>עקוב</button></form>
  </div>
  <div id="head"></div>
  <div id="body"></div>
</main>
</div>
<div id="remote">
  <span class="cap">שליטה<br>במצגת</span>
  <button id="rprev" title="מזיז את המצגת המוקרנת שקף אחד אחורה">&rsaquo; הקודם</button>
  <button id="rnext" title="מזיז את המצגת המוקרנת שקף אחד קדימה">הבא &lsaquo;</button>
  <button id="rmenu" title="מעבר בין המצגת וחבילות הגיבוי">&#9776;</button>
</div>
<div id="sheet"><div class="box" id="sheetbox"></div></div>

<script>document.write('<script src="deck.js?t=' + Date.now() + '"><\/script>' +
                       '<script src="script_view.js?t=' + Date.now() + '"><\/script>');</script>
<script>document.write('<script src="scripts.js?v=' + (window.BUILD || Date.now()) + '"><\/script>');</script>
<script>
(function(){
  "use strict";
  var P = new URLSearchParams(location.search);
  var CODE = P.get("follow") || "";
  var head = document.getElementById("head"), body = document.getElementById("body");
  if (!window.DECKS || !window.ScriptView){ body.textContent = "deck.js / script_view.js לא נטענו."; return; }
  var SV = ScriptView;

  var deck = "main", idx = 0;        /* what this page shows */
  var live = null;                   /* what the deck last announced: {deck, i} */

  function render(){
    var d = DECKS[deck], s = d.slides[idx];
    var where = (deck === "main" ? "" : d.label + " · ") + "שקף " + (idx + 1) + " / " + d.slides.length;
    document.getElementById("where").textContent = where;
    head.innerHTML = '<span class="num">' + (deck === "main" ? "" : d.label + " · ") + (idx + 1) + "</span>" +
                     (s.role ? '<span class="role" dir="auto">' + s.role + "</span>" : "") +
                     '<h1 dir="auto"></h1>';
    head.querySelector("h1").textContent = s.title || "";
    body.innerHTML = SV.html(window.SCRIPTS && SCRIPTS[s.id], { qaOpen: false });
    document.getElementById("live").hidden = !live || (live.deck === deck && live.i === idx);
    document.getElementById("main").scrollTop = 0;
    slide(s);
  }

  /* the slide pane: two frames, the next slide loads in the hidden one and swaps in when ready,
     so there is never a white flash between slides */
  var box = document.getElementById("slidebox"), frames = box.querySelectorAll("iframe"), front = 0, want = "";
  function fitAll(){ for (var i = 0; i < 2; i++) SV.fit(frames[i], box.clientWidth); }
  function slide(s){
    if (document.body.classList.contains("noslide")){ want = ""; return; }
    var url = SV.slideURL(s);
    if (url === want) return;
    want = url;
    var back = frames[1 - front];
    back.onload = function(){
      if (want !== url) return;
      SV.guard(back);
      back.classList.add("on"); frames[front].classList.remove("on");
      front = 1 - front;
    };
    back.src = url;
  }
  if (window.ResizeObserver) new ResizeObserver(fitAll).observe(box);
  addEventListener("resize", fitAll);

  /* the grip between slide and script: landscape sets the slide's width, portrait its height */
  var pane = document.getElementById("slidepane"), grip = document.getElementById("grip"), root = document.documentElement.style;
  try {
    if (localStorage.getItem("scriptPaneW")) root.setProperty("--paneW", localStorage.getItem("scriptPaneW"));
    if (localStorage.getItem("scriptPaneH")) root.setProperty("--paneH", localStorage.getItem("scriptPaneH"));
  } catch (e) {}
  grip.addEventListener("pointerdown", function(ev){
    ev.preventDefault();
    try { grip.setPointerCapture(ev.pointerId); } catch (e) {}
    grip.classList.add("drag");
  });
  grip.addEventListener("pointermove", function(ev){
    if (!grip.classList.contains("drag")) return;
    var r = pane.getBoundingClientRect(), portrait = innerHeight > innerWidth, v;
    if (portrait){
      v = Math.round(Math.max(.15, Math.min(.7, (ev.clientY - r.top) / innerHeight)) * 100) + "vh";
      root.setProperty("--paneH", v);
    } else {
      var w = r.left < innerWidth / 2 ? ev.clientX - r.left : r.right - ev.clientX;
      v = Math.round(Math.max(.2, Math.min(.75, w / innerWidth)) * 100) + "%";
      root.setProperty("--paneW", v);
    }
    fitAll();
  });
  function endDrag(){
    if (!grip.classList.contains("drag")) return;
    grip.classList.remove("drag");
    try {
      localStorage.setItem("scriptPaneW", root.getPropertyValue("--paneW") || "");
      localStorage.setItem("scriptPaneH", root.getPropertyValue("--paneH") || "");
    } catch (e) {}
  }
  grip.addEventListener("pointerup", endDrag);
  grip.addEventListener("pointercancel", endDrag);
  fitAll();

  var showSlide = true;
  try { showSlide = localStorage.getItem("scriptSlide") !== "0"; } catch (e) {}
  function slidePane(on){
    showSlide = on;
    document.body.classList.toggle("noslide", !on);
    document.getElementById("slidebtn").classList.toggle("off", !on);
    try { localStorage.setItem("scriptSlide", on ? "1" : "0"); } catch (e) {}
    if (on){ fitAll(); slide(DECKS[deck].slides[idx]); }
  }
  document.getElementById("slidebtn").onclick = function(){ slidePane(!showSlide); };
  document.body.classList.toggle("noslide", !showSlide);
  document.getElementById("slidebtn").classList.toggle("off", !showSlide);

  /* warnings and examiner Q&A stay hidden unless asked for — the script is what he says */
  var showHelp = false;
  try { showHelp = localStorage.getItem("scriptHelp") === "1"; } catch (e) {}
  function helpPane(on){
    showHelp = on;
    document.body.classList.toggle("nohelp", !on);
    document.getElementById("helpbtn").classList.toggle("off", !on);
    try { localStorage.setItem("scriptHelp", on ? "1" : "0"); } catch (e) {}
  }
  document.getElementById("helpbtn").onclick = function(){ helpPane(!showHelp); };
  helpPane(showHelp);

  function go(dk, i){
    if (!DECKS[dk]) return;
    deck = dk;
    idx = Math.max(0, Math.min(DECKS[dk].slides.length - 1, i));
    render();
  }

  function apply(m){
    if (!m || !DECKS[m.deck]) return;
    var k = SV.slideAt(m.deck, m.id);
    live = { deck: m.deck, i: k >= 0 ? k : +m.i || 0, rows: m.rows || [] };
    go(live.deck, live.i);
  }

  document.getElementById("prev").onclick = function(){ go(deck, idx - 1); };
  document.getElementById("next").onclick = function(){ go(deck, idx + 1); };
  document.getElementById("live").onclick = function(){ if (live) go(live.deck, live.i); };

  /* text size, remembered on this iPad only */
  var fs = 1.5;
  try { fs = +localStorage.getItem("scriptFs") || 1.5; } catch (e) {}
  function size(step){
    fs = Math.max(1.1, Math.min(2.6, Math.round((fs + step) * 10) / 10));
    document.documentElement.style.setProperty("--fs", fs + "rem");
    try { localStorage.setItem("scriptFs", fs); } catch (e) {}
  }
  size(0);
  document.getElementById("smaller").onclick = function(){ size(-0.1); };
  document.getElementById("bigger").onclick  = function(){ size(+0.1); };

  /* ---------- the relay. since=latest replays the slide that is up now, on every (re)connect ---------- */
  var conn = document.getElementById("conn"), connt = document.getElementById("connt");
  function state(on){
    conn.classList.toggle("on", on);
    connt.textContent = on ? "מחובר" : "מנותק";
  }

  /* the remote: moves the projected deck, not this page — the page follows when the deck answers */
  function remote(btn, msg){
    btn.onclick = function(){
      btn.classList.add("busy");
      SV.command(CODE, typeof msg === "function" ? msg() : msg).then(function(){ btn.classList.remove("busy"); },
                                 function(){ btn.classList.remove("busy"); btn.classList.add("fail");
                                             setTimeout(function(){ btn.classList.remove("fail"); }, 1500); });
    };
  }
  remote(document.getElementById("rnext"), { cmd: "next" });
  remote(document.getElementById("rprev"), { cmd: "prev" });

  /* the deck menu: the laptop sends its chooser rows with every slide, so this list is the deck's own */
  var sheet = document.getElementById("sheet"), sbox = document.getElementById("sheetbox");
  document.getElementById("rmenu").onclick = function(){
    var rows = (live && live.rows) || [];
    sbox.innerHTML = rows.length ? "" : '<div class="empty">עוד לא התקבל מצב מהמצגת.</div>';
    rows.forEach(function(r){
      if (r.grp){ var g = document.createElement("div"); g.className = "grp"; g.textContent = r.grp; sbox.appendChild(g); }
      var b = document.createElement("button");
      b.className = "row" + (r.home ? " home" : "");
      b.dir = "ltr";
      b.innerHTML = '<span class="k"></span><span></span>';
      b.firstChild.textContent = r.key || "";
      b.lastChild.textContent = r.label || "";
      remote(b, { cmd: "row", row: { home: !!r.home, resume: !!r.resume, deck: r.deck || "", at: r.at || "" } });
      b.addEventListener("click", function(){ sheet.classList.remove("open"); });
      sbox.appendChild(b);
    });
    sheet.classList.add("open");
  };
  sheet.onclick = function(ev){ if (ev.target === sheet) sheet.classList.remove("open"); };

  /* the iPad must not lock mid-defence */
  var lock = null;
  function wake(){
    if (!navigator.wakeLock || document.visibilityState !== "visible" || lock) return;
    navigator.wakeLock.request("screen").then(function(l){
      lock = l; l.addEventListener("release", function(){ lock = null; });
    }).catch(function(){});
  }
  addEventListener("click", wake);
  document.addEventListener("visibilitychange", wake);

  if (CODE){
    SV.listen(CODE, { since: "latest", onMsg: apply, onState: state });
    wake();
  } else {
    document.getElementById("setup").hidden = false;
    document.getElementById("conn").hidden = true;
    document.getElementById("remote").hidden = true;
    document.getElementById("setupf").onsubmit = function(ev){
      ev.preventDefault();
      var c = document.getElementById("code").value.trim();
      if (c) location.search = "?follow=" + encodeURIComponent(c);
    };
  }
  render();
})();
</script>
</body>
</html>
